name: verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-run:
    name: build + run the seven verifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: gcc --version | head -1 && make --version | head -1

      - name: Build the seven verifiers (gcc -Wall -Wextra -O2 -D_GNU_SOURCE)
        run: |
          set -euo pipefail
          mkdir -p bin
          n=0
          for f in */code/verify_*.c; do
            out="bin/$(basename "$f" .c)"
            gcc -Wall -Wextra -O2 -D_GNU_SOURCE -o "$out" "$f" -lm
            n=$((n+1))
          done
          echo "编译通过：$n 个验证器 .c，零告警" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$n" -eq 7 ] || { echo "::error::期望 7 个验证器，实得 $n"; exit 1; }

      - name: Run all seven (assert exit 0 / FAIL=0 / EXIT=0)
        run: |
          set +e
          bad=0; pass=0; total=0
          {
            echo ""
            echo "### 七支验证器实跑 / seven verifier runs"
            echo ""
            echo "| verifier | exit | 判据合计 | FAIL |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for b in bin/verify_*; do
            [ -x "$b" ] || continue
            name=$(basename "$b")
            out=$(timeout 600 "$b" 2>&1); rc=$?
            sum=$(printf '%s\n' "$out" | grep -oE 'RESULT PASS=[0-9]+' | tail -1 | cut -d= -f2)   # 末尾总帐已含各段小计，避免重复计数
            fails=$(printf '%s\n' "$out" | grep -oE 'FAIL=[0-9]+' | cut -d= -f2 | sort -n | tail -1)
            total=$((total + ${sum:-0}))
            echo "| \`$name\` | $rc | ${sum:-—} | ${fails:-0} |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" -ne 0 ]; then echo "::error file=$b::exit=$rc"; bad=1; fi
            if [ "${fails:-0}" != "0" ]; then echo "::error file=$b::FAIL=$fails"; bad=1; fi
            if printf '%s\n' "$out" | grep -qE 'EXIT=[0-9]+' && ! printf '%s\n' "$out" | grep -q 'EXIT=0'; then
              echo "::error file=$b::非 EXIT=0"; bad=1
            fi
            pass=$((pass+1))
          done
          echo "verifiers pass=$pass total_criteria=$total bad=$bad" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$pass" -eq 7 ] || { echo "::error::期望跑满 7 支，实得 $pass"; bad=1; }
          exit "$bad"

      - name: Upload built binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifiers-linux-x64
          path: bin/
          retention-days: 14

  windows-release:
    name: Windows x64 exes → release assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: MinGW toolchain (msys2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Build seven exes (Windows x64)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p out
          n=0
          for f in */code/verify_*.c; do
            gcc -Wall -Wextra -O2 -D_GNU_SOURCE -o "out/$(basename "$f" .c).exe" "$f" -lm
            n=$((n+1))
          done
          echo "built $n exes" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$n" -eq 7 ] || exit 1

      - name: Run the seven (must exit 0)
        shell: msys2 {0}
        run: |
          set +e
          bad=0; pass=0
          for b in out/verify_*.exe; do
            out=$(timeout 600 "$b" 2>&1); rc=$?
            if [ "$rc" -ne 0 ]; then echo "::error file=$b::exit=$rc"; bad=1; else pass=$((pass+1)); fi
            if printf '%s\n' "$out" | grep -qE 'FAIL=[1-9]'; then echo "::error file=$b::FAIL 非零"; bad=1; fi
          done
          echo "verifiers pass=$pass bad=$bad" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$bad"

      - name: Checksums + zip
        shell: pwsh
        run: |
          Push-Location out
          # 关键：LF + UTF-8(no BOM)，否则 `sha256sum -c` 会因行末 CR 报
          # "'file.exe'$'\r': No such file or directory"。Set-Content 在 Windows 上写 CRLF，故手写。
          $lines = Get-ChildItem *.exe | Sort-Object Name | ForEach-Object {
            (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower() + " *" + $_.Name
          }
          $text = ($lines -join "`n") + "`n"
          [IO.File]::WriteAllText((Join-Path (Get-Location).Path 'SHA256SUMS.txt'), $text, (New-Object System.Text.UTF8Encoding($false)))
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path * -DestinationPath "../github_upload-verify-windows-x64-$tag.zip" -Force
          "exes=$((Get-ChildItem *.exe).Count) sums=$((Get-Content SHA256SUMS.txt).Count)"
          $bytes = [IO.File]::ReadAllBytes((Join-Path (Get-Location).Path 'SHA256SUMS.txt'))
          "cr_bytes=$((($bytes | Where-Object { $_ -eq 13 }).Count))"
          Pop-Location

      - name: Publish release with assets
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }} — 7 papers / 7 C verifiers / 7 exes"
          body: |
            **七篇独立 / seven self-contained papers**：每篇 1 份英文说明 + 1 份中文说明 + 1 支 C 验证器（= 1 个 exe）。
            孪生素数并入 Hardy–Littlewood 作 `k=2` 专章（同一份 `paper.md` / `paper.zh.md` 的附章），不单列成篇。

            | # | 猜想 | 验证器 | 判据 |
            |---|---|---|---|
            | 1 | Birch–Swinnerton-Dyer | `verify_bsd.exe` | 55 |
            | 2 | Hardy–Littlewood（含孪生） | `verify_hl.exe` | 36 |
            | 3 | Hodge | `verify_hodge.exe` | 19 |
            | 4 | Navier–Stokes | `verify_ns.exe` | 19 |
            | 5 | P vs NP | `verify_pvsnp.exe` | 26 |
            | 6 | Riemann Hypothesis | `verify_rh.exe` | 21 |
            | 7 | Yang–Mills | `verify_ym.exe` | 18 |

            合计 190 条判据，全部为有限格上的可复算断言；七支 `rc=0`。
            **构建**：`gcc -Wall -Wextra -O2 -D_GNU_SOURCE`，7/7 零告警；资产由 CI 在 windows-latest + MinGW 现场编译，与源码同源。
            **校验**：`SHA256SUMS.txt`（7 行，就地 `sha256sum -c` 全通过；LF + UTF-8 no BOM）。
            **边界**：验证器验的是「各篇所依赖的结构前提在有限格上成立」，不是猜想本身的证明。
          files: |
            github_upload-verify-windows-x64-${{ github.ref_name }}.zip
            out/SHA256SUMS.txt
          fail_on_unmatched_files: true
